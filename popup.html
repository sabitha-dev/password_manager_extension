<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaultX</title>
  <link rel="stylesheet" href="css/popup.css" />
</head>
<body>

<!-- ════════════════════════════════════════════
  VIEW: AUTH (Login / Register)
═════════════════════════════════════════════ -->
<div id="view-auth" class="view active">

  <div class="auth-header">
    <div class="auth-logo-big">🔐</div>
    <div class="auth-title">VaultX</div>
    <div class="auth-subtitle">Your encrypted password vault</div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" id="tab-login">Sign In</button>
    <button class="tab" id="tab-register">Register</button>
  </div>

  <div class="view-body">

    <!-- LOGIN FORM -->
    <div id="login-section">
      <p id="login-error" class="error-msg hidden"></p>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email</label>
          <input id="login-email" type="email" class="form-input" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Master Password</label>
          <div class="input-row">
            <input id="login-password" type="password" class="form-input" placeholder="••••••••••" required autocomplete="current-password" />
            <button type="button" class="btn-icon toggle-pw" data-target="login-password" title="Toggle">👁</button>
          </div>
        </div>
        <button type="submit" id="btn-login" class="btn btn-primary">Sign In</button>
      </form>
    </div>

    <!-- REGISTER FORM -->
    <div id="register-section" class="hidden">
      <p id="register-error" class="error-msg hidden"></p>
      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-username">Username</label>
          <input id="reg-username" type="text" class="form-input" placeholder="johndoe" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-email">Email</label>
          <input id="reg-email" type="email" class="form-input" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password">Master Password</label>
          <div class="input-row">
            <input id="reg-password" type="password" class="form-input" placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password" />
            <button type="button" class="btn-icon toggle-pw" data-target="reg-password" title="Toggle">👁</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-confirm">Confirm Password</label>
          <div class="input-row">
            <input id="reg-confirm" type="password" class="form-input" placeholder="Repeat password" required autocomplete="new-password" />
            <button type="button" class="btn-icon toggle-pw" data-target="reg-confirm" title="Toggle">👁</button>
          </div>
        </div>
        <button type="submit" id="btn-register" class="btn btn-primary">Create Account</button>
      </form>
    </div>

  </div><!-- /view-body -->
</div>


<!-- ════════════════════════════════════════════
  VIEW: VAULT (Password List)
═════════════════════════════════════════════ -->
<div id="view-vault" class="view">

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🔐</div>
      VaultX
    </div>
    <div class="header-right">
      <span class="user-badge" id="user-name">—</span>
      <button class="btn-logout" id="btn-logout" title="Sign out">⏏</button>
    </div>
  </div>

  <!-- Section header + Add button -->
  <div class="section-header">
    <span class="section-title">My Vault</span>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="vault-count" id="vault-count">0 items</span>
      <button class="btn btn-ghost btn-sm" id="btn-add-new">+ Add</button>
    </div>
  </div>

  <!-- Search -->
  <div class="search-bar">
    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input id="search-input" type="text" class="form-input" placeholder="Search vault…" />
    </div>
  </div>

  <!-- Password List -->
  <div id="password-list">
    <div class="loading-state">Loading vault…</div>
  </div>

</div>


<!-- ════════════════════════════════════════════
  VIEW: ADD PASSWORD
═════════════════════════════════════════════ -->
<div id="view-add" class="view">

  <div class="form-header">
    <button class="btn-back" id="btn-back-add" title="Back">←</button>
    <span class="form-header-title">Add Password</span>
  </div>

  <div class="view-body">
    <p id="add-error" class="error-msg hidden"></p>
    <form id="add-form">

      <div class="form-group">
        <label class="form-label" for="add-site-name">Site / App Name *</label>
        <input id="add-site-name" type="text" class="form-input" placeholder="e.g. GitHub" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="add-site-url">URL</label>
        <input id="add-site-url" type="url" class="form-input" placeholder="https://github.com" />
      </div>

      <div class="form-group">
        <label class="form-label" for="add-username">Username</label>
        <input id="add-username" type="text" class="form-input" placeholder="johndoe" autocomplete="off" />
      </div>

    

      <div class="form-group">
        <label class="form-label" for="add-password">Password *</label>
        <div class="input-row">
          <input id="add-password" type="password" class="form-input" placeholder="••••••••••" required autocomplete="new-password" />
          <button type="button" class="btn-icon toggle-pw" data-target="add-password" title="Toggle">👁</button>
          <button type="button" class="btn-icon" id="btn-generate-add" title="Generate strong password">⚡</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="add-notes">Notes</label>
        <textarea id="add-notes" class="form-input" placeholder="Optional notes…"></textarea>
      </div>

      <button type="submit" id="btn-save-add" class="btn btn-primary">Save Password</button>
    </form>
  </div>

</div>


<!-- ════════════════════════════════════════════
  VIEW: DETAIL (View Entry)
═════════════════════════════════════════════ -->
<div id="view-detail" class="view">

  <div class="detail-header">
    <button class="btn-back" id="btn-back-detail" title="Back">←</button>
    <div class="detail-site-icon" id="detail-favicon">🌐</div>
    <div class="detail-site-name" id="detail-site">—</div>
  </div>

  <div class="view-body" style="padding-top:4px">
    <div class="detail-grid">

      <div class="detail-row">
        <span class="detail-label">Website URL</span>
        <div class="detail-value-row">
          <a href="#" id="detail-url" class="detail-value" target="_blank">—</a>
        </div>
      </div>

     

      <div class="detail-row">
        <span class="detail-label">App Name</span>
        <div class="detail-value-row">
          <span id="detail-email" class="detail-value">—</span>
          <button class="btn-icon" id="btn-copy-email" title="Copy">⎘</button>
        </div>
      </div>
 <div class="detail-row">
        <span class="detail-label">User Name</span>
        <div class="detail-value-row">
          <span id="detail-username" class="detail-value">—</span>
          <button class="btn-icon" id="btn-copy-username" title="Copy">⎘</button>
        </div>
      </div>
      <div class="detail-row">
        <span class="detail-label">Password</span>
        <div class="detail-value-row">
          <span id="detail-password-val" class="detail-value" data-raw="" data-visible="false">••••••••</span>
          <button id="btn-reveal-password">👁 Reveal</button>
          <button class="btn-icon" id="btn-copy-password" title="Copy">⎘</button>
        </div>
      </div>

      <div class="detail-row">
        <span class="detail-label">Notes</span>
        <span id="detail-notes" class="detail-value" style="margin-top:4px">—</span>
      </div>

    </div>
  </div>

  <div class="detail-actions">
    <button class="btn btn-primary" id="btn-autofill" style="flex:1">⌨ Autofill</button>
    <button class="btn btn-ghost" id="btn-edit" style="flex:1">✏ Edit</button>
    <button class="btn btn-danger btn-sm" id="btn-delete">🗑</button>
  </div>

</div>


<!-- ════════════════════════════════════════════
  VIEW: EDIT PASSWORD
═════════════════════════════════════════════ -->
<div id="view-edit" class="view">

  <div class="form-header">
    <button class="btn-back" id="btn-back-edit" title="Back">←</button>
    <span class="form-header-title">Edit Password</span>
  </div>

  <div class="view-body">
    <p id="edit-error" class="error-msg hidden"></p>
    <form id="edit-form">

      <div class="form-group">
        <label class="form-label" for="edit-site-name">Site / App Name *</label>
        <input id="edit-site-name" type="text" class="form-input" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="edit-site-url">URL</label>
        <input id="edit-site-url" type="url" class="form-input" />
      </div>

      <div class="form-group">
        <label class="form-label" for="edit-username">Username</label>
        <input id="edit-username" type="text" class="form-input" autocomplete="off" />
      </div>

      <div class="form-group">
        <label class="form-label" for="edit-email">Email</label>
        <input id="edit-email" type="email" class="form-input" />
      </div>

      <div class="form-group">
        <label class="form-label" for="edit-password">Password *</label>
        <div class="input-row">
          <input id="edit-password" type="password" class="form-input" required autocomplete="new-password" />
          <button type="button" class="btn-icon toggle-pw" data-target="edit-password" title="Toggle">👁</button>
          <button type="button" class="btn-icon" id="btn-generate-edit" title="Generate strong password">⚡</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="edit-notes">Notes</label>
        <textarea id="edit-notes" class="form-input"></textarea>
      </div>

      <button type="submit" id="btn-save-edit" class="btn btn-primary">Update Password</button>
    </form>
  </div>

</div>


<!-- Toast notification -->
<div id="toast" class="toast"></div>

<!-- Scripts -->
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/popup.js"></script>

</body>
</html>
